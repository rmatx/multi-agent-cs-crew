# Demo stack — one service, one volume (SAD §5 "demo: one container/VM; SQLite under data/").
#
# THE PORT BINDING IS A SECURITY CONTROL, NOT A DEFAULT. `127.0.0.1:3000:3000` publishes to
# loopback only, which is the exact condition security.md attaches to accepting SEC-01 and
# SEC-02: this build has no authentication, so any customer's order is readable by anyone who
# can reach the port, and a conversation id is a bearer token for that conversation's history.
# Changing this line to `3000:3000` exposes the app on every interface and turns both accepted
# risks into live ones. Do not change it without reading security.md "Handoff readiness".

services:
  novamart:
    build:
      context: .
      dockerfile: Dockerfile
    image: novamart-support-crew:latest
    # Loopback only. See the note above before touching this.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # NOTE: every variable below has a REAL default. Passthrough entries of the form
      # `FOO: ${FOO:-}` are deliberately absent: Compose resolves them to an EMPTY STRING and an
      # empty string from `environment:` OVERRIDES `env_file`, so such a line silently erases
      # the value it looks like it is forwarding. That is DEF-15 — it made `CHAT_ENGINE=sdk`
      # unstartable through compose, because MODEL_ID is required with no default by design
      # (config.ts: a silently-chosen model makes the Audit line a lie). Anything not listed
      # here reaches the container from .env.local or the platform's own variables.
      # Engine. `deterministic` is the keyless default and costs nothing; `sdk` is the crew
      # and spends the API key on every turn. Running the crew here needs MODEL_ID and
      # ANTHROPIC_API_KEY to reach the container from .env.local — which is exactly what the
      # removed passthrough lines used to prevent.
      CHAT_ENGINE: ${CHAT_ENGINE:-deterministic}
      MODEL_EFFORT: ${MODEL_EFFORT:-low}
      # Turns per minute per client. A cost guard on an unauthenticated endpoint, not access
      # control (security.md SEC-05).
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-20}
    # Secrets by NAME only, never inline: ANTHROPIC_API_KEY and OPERATOR_KEY live in
    # .env.local, which is gitignored and never copied into the image (.dockerignore).
    env_file:
      - path: .env.local
        required: false
    volumes:
      # Durable state (ADR-10), at /app/var — NOT /app/data, which holds the read-only fixture
      # and policy corpus a volume would mask. Named volume rather than a bind mount so the
      # container's unprivileged `node` user owns it without host-side chown.
      - novamart-data:/app/var
      # Operator traces live in the volume too, NOT in a host bind mount.
      #
      # This used to bind `./project-context/2.build/logs` into the container so an operator
      # could read traces on the host. It does not work: the host directory appears root-owned
      # inside the container, the app runs as uid 1000, and trace writes are best-effort and
      # swallowed by design — so turns succeed, the operator sees no new trace, and nothing
      # anywhere reports an error. A diagnostic channel that fails silently is worse than one
      # that is absent.
      #
      # Read them out explicitly instead — deterministic, and no uid mapping to get right:
      #   docker compose cp novamart:/app/var/logs ./project-context/2.build/logs
      #
      # They contain customer conversations (security.md SEC-03): treat whatever you copy out
      # as customer data, and prune on the schedule the runbook names.
    restart: unless-stopped

volumes:
  novamart-data:
