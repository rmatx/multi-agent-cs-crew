[project]
name = "multi_agent_cs_crew"
version = "0.1.0"
description = "multi-agent-cs-crew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[anthropic,tools]>=1.15.16,<2.0.0",
]

[project.scripts]
multi_agent_cs_crew = "multi_agent_cs_crew.main:run"
run_crew = "multi_agent_cs_crew.main:run"
train = "multi_agent_cs_crew.main:train"
replay = "multi_agent_cs_crew.main:replay"
test = "multi_agent_cs_crew.main:test"
run_with_trigger = "multi_agent_cs_crew.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "29c3c2dd-ae61-4d38-bd35-16527199834e"
