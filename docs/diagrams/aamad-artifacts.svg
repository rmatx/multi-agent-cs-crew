<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aamad-artifacts-title aamad-artifacts-desc">
      <title id="aamad-artifacts-title">The project-context chain</title>
      <desc id="aamad-artifacts-desc">Requirements in the Define phase produce the architecture document that every Build artifact traces back to; six Build artifacts, one owner each, lead to the QA and security gates that Deliver will not start without.</desc>
      <style>@import url("https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ZONES -->
      <rect x="32" y="208" width="232" height="208" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="104" y="212" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="148" y="221" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">1 · DEFINE</text>

      <rect x="376" y="72" width="232" height="480" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="452" y="76" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="492" y="85" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">2 · BUILD</text>

      <rect x="720" y="244" width="232" height="136" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="792" y="248" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="836" y="257" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">3 · DELIVER</text>

      <!-- ARROWS -->
      <line x1="148" y1="296" x2="148" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <path d="M 248,356 H 312 Q 320,356 320,348 V 140 Q 320,132 328,132 H 392"
            fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="264" y="232" width="46" height="12" rx="2" fill="#f5f5f5"/>
      <text x="287" y="241" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GOVERNS</text>

      <path d="M 592,420 H 656 Q 664,420 664,412 V 320 Q 664,312 672,312 H 736"
            fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="608" y="360" width="46" height="12" rx="2" fill="#f5f5f5"/>
      <text x="631" y="369" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">QA GATE</text>

      <path d="M 592,492 H 680 Q 688,492 688,484 V 344 Q 688,336 696,336 H 736"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="628" y="440" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="654" y="449" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SEC GATE</text>

      <!-- DEFINE NODES -->
      <rect x="48" y="240" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="240" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="148" y="270" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">mrd.md · prd.md</text>
      <text x="148" y="286" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">@product-mgr</text>

      <rect x="48" y="328" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="328" width="200" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="148" y="358" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">sad.md</text>
      <text x="148" y="374" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">@system.arch</text>

      <!-- BUILD NODES -->
      <rect x="392" y="104" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="392" y="104" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="492" y="134" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">setup.md</text>
      <text x="492" y="150" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">@project.mgr</text>

      <rect x="392" y="176" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="392" y="176" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="492" y="206" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">frontend.md</text>
      <text x="492" y="222" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">@frontend.eng</text>

      <rect x="392" y="248" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="392" y="248" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="492" y="278" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">backend.md</text>
      <text x="492" y="294" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">@backend.eng</text>

      <rect x="392" y="320" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="392" y="320" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="492" y="350" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">integration.md</text>
      <text x="492" y="366" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">@integration.eng</text>

      <rect x="392" y="392" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="392" y="392" width="200" height="56" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="492" y="422" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">qa.md</text>
      <text x="492" y="438" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">@qa.eng · 55 AC</text>

      <rect x="392" y="464" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="392" y="464" width="200" height="56" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="492" y="494" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">security.md</text>
      <text x="492" y="510" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">@security.eng</text>

      <!-- DELIVER NODE -->
      <rect x="736" y="276" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="736" y="276" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="836" y="306" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">deploy.md</text>
      <text x="836" y="322" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">user-guide.md</text>
      <text x="836" y="338" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">@devops.eng</text>

      <!-- EDITORIAL CALLOUT -->
      <text x="32" y="580" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Every artifact ends with the same four sections — Sources, Assumptions, Open Questions, Audit — so any</text>
      <text x="32" y="600" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">claim can be traced back to the document that authorised it, and every edit to the persona that made it.</text>

      <!-- LEGEND -->
      <line x1="32" y1="624" x2="968" y2="624" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="644" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="112" y="636" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="132" y="645" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">authoritative for scope — PRD and SAD win any tie</text>
      <rect x="480" y="636" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="645" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">epic record</text>
      <rect x="640" y="636" width="12" height="12" rx="2" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="660" y="645" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">phase gate — Deliver halts without it</text>
    </svg>
