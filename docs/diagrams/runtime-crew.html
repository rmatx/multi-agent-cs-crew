<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaMart runtime crew</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #eb6c36;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Org chart · server/runtime/agents.ts</p>
    <h1>Who answers the customer</h1>

    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="runtime-crew-title runtime-crew-desc">
      <title id="runtime-crew-title">NovaMart runtime crew</title>
      <desc id="runtime-crew-desc">The triage-router coordinator is the only agent that speaks to the customer; it delegates one hop to one of four read-only specialists or to a terminal escalation handler that opens a ticket for a human.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ARROWS (drawn before boxes) -->
      <!-- outer-left: attach 420 -> order-specialist cx 108, turns at y=168 -->
      <path d="M 420,128 V 160 Q 420,168 412,168 H 116 Q 108,168 108,176 V 280"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- inner-left: attach 460 -> faq-policy cx 304, turns at y=192 -->
      <path d="M 460,128 V 184 Q 460,192 452,192 H 312 Q 304,192 304,200 V 280"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- centre: attach 500 -> plus-specialist cx 500 -->
      <line x1="500" y1="128" x2="500" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- inner-right: attach 540 -> returns-advisor cx 696, turns at y=192 -->
      <path d="M 540,128 V 184 Q 540,192 548,192 H 688 Q 696,192 696,200 V 280"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- outer-right: attach 580 -> escalation-handoff cx 892, turns at y=168 -->
      <path d="M 580,128 V 160 Q 580,168 588,168 H 884 Q 892,168 892,176 V 280"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- arrow label on the centre segment -->
      <rect x="510" y="212" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="546" y="221" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AGENT TOOL</text>

      <!-- COORDINATOR -->
      <rect x="380" y="64" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="380" y="64" width="240" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="388" y="72" width="36" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="406" y="81" fill="rgba(235,108,54,0.85)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MAIN</text>
      <text x="500" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">triage-router</text>
      <text x="500" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">classifies · delegates · max 4 hops</text>

      <!-- SPECIALISTS -->
      <rect x="20" y="280" width="176" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="20" y="280" width="176" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="28" y="288" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="46" y="297" fill="rgba(79,93,117,0.85)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">READ</text>
      <text x="108" y="322" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">order-specialist</text>
      <text x="108" y="338" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">status · dates · items</text>
      <text x="108" y="352" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">4 tools</text>

      <rect x="216" y="280" width="176" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="216" y="280" width="176" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="224" y="288" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="242" y="297" fill="rgba(79,93,117,0.85)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">READ</text>
      <text x="304" y="322" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">faq-policy</text>
      <text x="304" y="338" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">written policy only</text>
      <text x="304" y="352" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">1 tool</text>

      <rect x="412" y="280" width="176" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="412" y="280" width="176" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="420" y="288" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="438" y="297" fill="rgba(79,93,117,0.85)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">READ</text>
      <text x="500" y="322" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">plus-specialist</text>
      <text x="500" y="338" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">membership · benefits</text>
      <text x="500" y="352" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">3 tools</text>

      <rect x="608" y="280" width="176" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="608" y="280" width="176" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="616" y="288" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="634" y="297" fill="rgba(79,93,117,0.85)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">READ</text>
      <text x="696" y="322" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">returns-advisor</text>
      <text x="696" y="338" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">order + policy, one hop</text>
      <text x="696" y="352" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">4 tools</text>

      <rect x="804" y="280" width="176" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="804" y="280" width="176" height="80" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="812" y="288" width="60" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="842" y="297" fill="rgba(235,108,54,0.85)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TERMINAL</text>
      <text x="892" y="322" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">escalation-handoff</text>
      <text x="892" y="338" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">opens a ticket stub</text>
      <text x="892" y="352" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2 tools</text>

      <!-- EDITORIAL CALLOUT -->
      <text x="20" y="408" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">No specialist holds the Agent tool, so no specialist can spawn another — the capability is absent,</text>
      <text x="20" y="428" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">not merely discouraged. One hop out, one answer back, and the coordinator writes the only reply.</text>

      <!-- LEGEND -->
      <line x1="20" y1="460" x2="980" y2="460" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="20" y="480" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="100" y="472" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="120" y="481" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">front door — the only voice the customer hears</text>
      <rect x="420" y="472" width="12" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="440" y="481" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">read-only specialist — advises, never acts</text>
      <rect x="728" y="472" width="12" height="12" rx="2" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="748" y="481" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">terminal — hands off to a human</text>
    </svg>
  </div>
</body>
</html>
